# Local Postgres only. The app itself runs on the host (npm run start:dev).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: quakes
      POSTGRES_PASSWORD: quakes
      POSTGRES_DB: quakes
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U quakes']
      interval: 2s
      retries: 15

volumes:
  pgdata:
